<script>window.addEventListener("load",function(){var s=document.createElement("script");s.src="https://cdn.tailwindcss.com";document.head.appendChild(s);});</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f172a; color:#e2e8f0; overflow:hidden; }
video { background:#000; display:block; }

.video-wrap { position:relative; display:inline-flex; max-width:100%; max-height:100%; }
.video-wrap video { max-width:100%; max-height:100%; border-radius:8px; }
.video-overlay { position:absolute; inset:0; border-radius:8px; cursor:crosshair; z-index:5; user-select:none; }
.video-hint {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#94a3b8; font-size:11px; padding:18px 10px 6px;
  text-align:center; border-radius:0 0 8px 8px; pointer-events:none;
}
.video-overlay:hover .video-hint { color:#e2e8f0; }
.marker-in-badge {
  position:absolute; top:8px; left:8px; background:#16a34a; color:#fff;
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px;
  pointer-events:none; display:flex; align-items:center; gap:4px;
}
.dot-pulse { width:6px; height:6px; border-radius:50%; background:#86efac; animation:dp 1s infinite; }
@keyframes dp { 0%,100%{opacity:1} 50%{opacity:.2} }

.time-display { display:flex; align-items:center; gap:8px; background:#0f172a; border:1px solid #1e293b; border-radius:8px; padding:4px 10px; }
.time-block { display:flex; flex-direction:column; align-items:center; }
.time-label { font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:#475569; font-weight:600; line-height:1; margin-bottom:1px; }
.time-value { font-family:monospace; font-weight:700; font-size:13px; letter-spacing:.02em; line-height:1; }
.tv-total { color:#60a5fa; } .tv-mark { color:#4ade80; } .tv-mark.off { color:#1e293b; }
.time-div { width:1px; height:28px; background:#1e293b; }

.timeline-bar { position:relative; height:26px; background:#1e293b; border-radius:6px; overflow:hidden; cursor:pointer; }
.tl-seg { position:absolute; top:3px; height:20px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; box-shadow:0 1px 4px rgba(0,0,0,.5); transition:opacity .12s; }
.tl-seg:hover { opacity:.8; filter:brightness(1.18); }
.tl-seg.hi { outline:2px solid #fff; outline-offset:-1px; }
.playhead { position:absolute; top:0; width:2px; background:#60a5fa; height:100%; pointer-events:none; z-index:10; }
.playhead::after { content:''; position:absolute; top:-4px; left:-4px; width:10px; height:8px; background:#60a5fa; clip-path:polygon(50% 100%,0 0,100% 0); }
.start-mark { position:absolute; top:0; width:2px; background:#4ade80; height:100%; pointer-events:none; z-index:9; box-shadow:0 0 6px #4ade80; }

.wbtn { padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; border:1px solid #334155; cursor:pointer; background:#1e293b; color:#64748b; transition:all .12s; }
.wbtn.on { background:#0369a1; border-color:#0284c7; color:#7dd3fc; }
.wbtn:hover:not(.on) { border-color:#475569; color:#94a3b8; }

.btn { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:all .15s; white-space:nowrap; }
.btn-blue   { background:#3b82f6; color:#fff; } .btn-blue:hover   { background:#2563eb; }
.btn-green  { background:#16a34a; color:#fff; } .btn-green:hover  { background:#15803d; }
.btn-slate  { background:#334155; color:#e2e8f0; } .btn-slate:hover  { background:#475569; }
.btn-purple { background:#7c3aed; color:#fff; } .btn-purple:hover { background:#6d28d9; }
.btn-amber  { background:#d97706; color:#fff; } .btn-amber:hover  { background:#b45309; }
.btn:disabled { opacity:.35; cursor:not-allowed; }

select, input[type=text], input[type=number] { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:5px; padding:3px 7px; font-size:12px; }
select:focus, input:focus { outline:2px solid #3b82f6; border-color:#3b82f6; }
input[type=range] { accent-color:#3b82f6; }

.badge { display:inline-block; padding:2px 7px; border-radius:9999px; font-size:10px; font-weight:700; }
.b-va { background:#14532d; color:#86efac; } .b-aux { background:#451a03; color:#fcd34d; } .b-wa { background:#450a0a; color:#fca5a5; }
.swatch { display:inline-block; border-radius:3px; box-shadow:0 0 0 1px rgba(255,255,255,.12); flex-shrink:0; }

.task-row { cursor:pointer; transition:background .1s; }
.task-row:hover { background:#1e293b; }
.task-row.hi-row { background:#1e3a5f !important; }
.stat-card { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:10px 14px; }
.kbd { display:inline-block; padding:1px 5px; border-radius:4px; background:#334155; border:1px solid #475569; font-size:10px; font-family:monospace; color:#94a3b8; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:#0f172a; }
::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }

(function(){
  var _SK=[80,111,119,101,114,110,101,116,50,48,50,52,80,73,69];
  function _h(s){var h=5381;for(var i=0;i<s.length;i++)h=((Math.imul(h,33)+s.charCodeAt(i))>>>0);return h;}
  window._pieLicCheck=function(key){
    if(!key||typeof key!=='string')return null;
    var k=key.toUpperCase().trim();
    if(k.indexOf('PIE-')===0)k=k.slice(4);
    var raw=k.replace(/[^0-9A-F]/g,'');
    if(raw.length!==12)return null;
    var ym=raw.slice(0,4);
    var sk=String.fromCharCode.apply(null,_SK);
    var h1=_h(ym+sk).toString(16).toUpperCase().padStart(8,'0');
    var chk=h1.slice(0,8);
    if(raw.slice(4)!==chk)return null;
    var ymv=parseInt(ym,16);
    var year=2000+Math.floor(ymv/12);
    var month=(ymv%12)+1;
    return {year:year,month:month};
  };
})();

function fmt(sec, ms=true) {
  if (!isFinite(sec)||sec<0) return ms?'00:00:00.000':'00:00:00';
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  const mss=Math.round((sec-Math.floor(sec))*1000);
  const p=n=>String(n).padStart(2,'0');
  return ms?`${p(h)}:${p(m)}:${p(s)}.${String(mss).padStart(3,'0')}`:`${p(h)}:${p(m)}:${p(s)}`;
}
function fmtS(sec) { // compact seconds display
  if (!isFinite(sec)||sec<0) return '-';
  return sec>=60 ? `${Math.floor(sec/60)}m${(sec%60).toFixed(1)}s` : `${sec.toFixed(3)}s`;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

// ─────────────────────────────────────────
//  Auto cycle assignment
// ─────────────────────────────────────────
function autoAssignCycles(tasks) {
  if (!tasks.length) return tasks;
  const sorted = [...tasks].sort((a,b)=>a.startTime-b.startTime);
  const counts = {};
  sorted.forEach(t=>{ counts[t.name]=(counts[t.name]||0)+1; });
  const anchor = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const boundaries = sorted.filter(t=>t.name===anchor).map(t=>t.startTime);
  return sorted.map(t=>{
    let cycle=1;
    for (let i=0;i<boundaries.length;i++) if(t.startTime>=boundaries[i]) cycle=i+1;
    return {...t, cycle:Math.min(10,cycle)};
  });
}

// ─────────────────────────────────────────
//  GanttByName (rows = unique task names, bars colored by cycle)
// ─────────────────────────────────────────
function GanttByName({ tasks, totalDuration, currentTime, onSeek, onLoopTask, activeTask }) {
  const svgRef=useRef(null);
  const cRef=useRef(null);
  const [svgW,setSvgW]=useState(800);
  const ROW_H=40, PL=160, PT=30, PR=20, PB=16;
  useEffect(()=>{
    if(!cRef.current) return;
    const ro=new ResizeObserver(e=>setSvgW(e[0].contentRect.width));
    ro.observe(cRef.current); return()=>ro.disconnect();
  },[]);

  // Unique task names sorted by first occurrence
  const names=useMemo(()=>{
    const seen=new Set(), order=[];
    [...tasks].sort((a,b)=>a.startTime-b.startTime).forEach(t=>{ if(!seen.has(t.name)){seen.add(t.name);order.push(t.name);} });
    return order;
  },[tasks]);

  if(!tasks.length) return React.createElement('div',{className:'flex flex-col items-center justify-center h-full text-slate-600 gap-2'},
    React.createElement('div',{className:'text-5xl'},'📊'),
    React.createElement('p',{className:'text-sm'},'분석 탭에서 작업 요소를 추가하세요.'),
  );

  const dur=totalDuration||1;
  const chartW=Math.max(1,svgW-PL-PR);
  const svgH=names.length*ROW_H+PT+PB+10;
  const rawInt=dur/Math.max(4,Math.floor(chartW/70));
  const nI=[.5,1,2,5,10,15,30,60,120,300,600];
  const tickInt=nI.find(n=>n>=rawInt)||Math.ceil(rawInt/10)*10;
  const ticks=[]; for(let t=0;t<=dur+.001;t+=tickInt) ticks.push(parseFloat(t.toFixed(3)));
  const xOf=t=>PL+(t/dur)*chartW;

  // Compute max cycles for multi-bar height splitting
  const maxCycle=tasks.reduce((m,t)=>Math.max(m,t.cycle||1),0)||1;
  const barH=Math.max(10,Math.min(22,(ROW_H-10)/Math.min(maxCycle,10)));

  return React.createElement('div',{ref:cRef,className:'gantt-wrap flex-1 select-none'},
    React.createElement('svg',{ref:svgRef,width:svgW,height:svgH,style:{display:'block',minWidth:500},onClick:e=>{
      const r=svgRef.current.getBoundingClientRect();
      const x=e.clientX-r.left-PL; if(x<0) return;
      onSeek(Math.max(0,Math.min(dur,(x/chartW)*dur)));
    }},
      names.map((n,i)=>React.createElement('rect',{key:'bg'+n,x:0,y:PT+i*ROW_H,width:svgW,height:ROW_H,fill:i%2?'#111827':'#0f172a'})),
      ticks.map(t=>React.createElement('line',{key:'g'+t,x1:xOf(t),y1:PT-10,x2:xOf(t),y2:svgH-PB,className:'g-grid'})),
      ticks.map(t=>React.createElement('g',{key:'ax'+t},
        React.createElement('line',{x1:xOf(t),y1:PT-10,x2:xOf(t),y2:PT-2,stroke:'#334155',strokeWidth:1}),
        React.createElement('text',{x:xOf(t),y:PT-12,textAnchor:'middle',fontSize:9,fill:'#475569',fontFamily:'monospace'},
          fmt(t,false).replace(/^00:00:/,'').replace(/^00:/,'')||'0'),
      )),
      React.createElement('line',{x1:PL,y1:PT-1,x2:PL+chartW,y2:PT-1,stroke:'#334155',strokeWidth:1}),

      names.map((name,ri)=>{
        const rowTasks=[...tasks.filter(t=>t.name===name)].sort((a,b)=>a.startTime-b.startTime);
        const rowY=PT+ri*ROW_H;
        const cy=rowY+ROW_H/2;
        return React.createElement('g',{key:name},
          // Row label
          React.createElement('text',{x:PL-10,y:cy,textAnchor:'end',dominantBaseline:'middle',fontSize:11,fill:'#94a3b8'},
            name.length>19?name.slice(0,18)+'…':name),
          // occurrence count
          React.createElement('text',{x:PL-10,y:cy+11,textAnchor:'end',dominantBaseline:'middle',fontSize:8.5,fill:'#475569'},
            `${rowTasks.length}회`),
          // Bars per occurrence, vertically stacked within row
          rowTasks.map((t,bi)=>{
            const x=xOf(t.startTime), w=Math.max(4,(t.duration/dur)*chartW);
            const cNum=t.cycle||1;
            const bc=CYCLE_COLORS[cNum-1];
            // Vertical placement within row (stack by cycle order)
            const totalBars=rowTasks.length;
            const slotH=Math.max(8,Math.min(barH,(ROW_H-8)/totalBars));
            const bY=rowY+4+bi*slotH;
            const isAct=activeTask===t.id;
            return React.createElement('g',{key:t.id,style:{cursor:'pointer'},onClick:e=>{e.stopPropagation();onLoopTask(t);}},
              React.createElement('rect',{x,y:bY,width:w,height:Math.max(6,slotH-1),rx:2,fill:bc,opacity:isAct?1:.75,stroke:isAct?'#fff':'rgba(255,255,255,.1)',strokeWidth:isAct?1.5:.5}),
              w>24&&React.createElement('text',{x:x+w/2,y:bY+slotH/2-1,textAnchor:'middle',dominantBaseline:'middle',fontSize:8,fill:'#fff',fontWeight:700,style:{pointerEvents:'none'}},
                `C${cNum}: ${fmtS(t.duration)}`),
            );
          }),
        );
      }),

      React.createElement('line',{className:'g-playhead',x1:xOf(currentTime),y1:PT-10,x2:xOf(currentTime),y2:svgH-PB}),
      React.createElement('polygon',{points:`${xOf(currentTime)},${PT-10} ${xOf(currentTime)-5},${PT-18} ${xOf(currentTime)+5},${PT-18}`,fill:'#60a5fa',style:{pointerEvents:'none'}}),
    ),

// CycleComparison – matrix + bar/horizontal charts
// ─────────────────────────────────────────
function CycleComparison({ tasks, onSeek }) {
  const [chartMode, setChartMode] = useState('matrix');   // 'matrix' | 'chart' | 'xy'
  const [chartType, setChartType] = useState('total');    // 'total' | 'bytask'
  const [orient,    setOrient]    = useState('vertical'); // 'vertical' | 'horizontal'
  const [xAxis,     setXAxis]     = useState('cycle');    // 'cycle' | 'task'
  const [yAxis,     setYAxis]     = useState('dur');      // 'dur' | 'cv'

  const names=useMemo(()=>{
    const seen=new Set(), order=[];
    [...tasks].sort((a,b)=>a.startTime-b.startTime).forEach(t=>{ if(!seen.has(t.name)){seen.add(t.name);order.push(t.name);} });
    return order;
  },[tasks]);

  const cycles=useMemo(()=>{
    const s=new Set(tasks.map(t=>t.cycle||1));
    return [...s].sort((a,b)=>a-b);
  },[tasks]);

  if(!tasks.length||!cycles.length) return React.createElement('div',{className:'flex flex-col items-center justify-center h-full text-slate-600 gap-2'},
    React.createElement('div',{className:'text-5xl'},'📈'),
    React.createElement('p',{className:'text-sm'},'분석 탭에서 작업 요소에 사이클을 지정하세요.'),
  );

  // matrix: name -> cycle -> tasks[]
  const matrix={};
  names.forEach(n=>{ matrix[n]={}; cycles.forEach(c=>{ matrix[n][c]=[]; }); });
  tasks.forEach(t=>{ const n=t.name,c=t.cycle||1; if(matrix[n]&&matrix[n][c]!==undefined) matrix[n][c].push(t); });

  function cellDur(n,c){ return matrix[n][c].reduce((s,t)=>s+t.duration,0); }
  function cellAvg(n){ return cycles.reduce((s,c)=>s+cellDur(n,c),0)/cycles.length; }
  function cellMin(n){ return Math.min(...cycles.map(c=>cellDur(n,c))); }
  function cellMax(n){ return Math.max(...cycles.map(c=>cellDur(n,c))); }
  function cov(n){
    const avg=cellAvg(n); if(!avg) return 0;
    const std=Math.sqrt(cycles.reduce((s,c)=>s+Math.pow(cellDur(n,c)-avg,2),0)/cycles.length);
    return (std/avg)*100;
  }
  function cycleTotalDur(c){ return names.reduce((s,n)=>s+cellDur(n,c),0); }
  function cellBg(n,c){
    const d=cellDur(n,c); if(!d) return 'transparent';
    const mn=cellMin(n),mx=cellMax(n);
    if(mx===mn) return 'rgba(59,130,246,.15)';
    const ratio=(d-mn)/(mx-mn);
    if(ratio<.33) return 'rgba(34,197,94,.18)';
    if(ratio<.66) return 'rgba(234,179,8,.18)';
    return 'rgba(239,68,68,.18)';
  }

  const cycleTotals=cycles.map(c=>cycleTotalDur(c));
  const maxTotal=Math.max(...cycleTotals,1);
  const avgTotal=cycleTotals.reduce((s,v)=>s+v,0)/cycleTotals.length;
  const maxTaskDur=Math.max(...names.map(n=>Math.max(...cycles.map(c=>cellDur(n,c)))),1);

  // ── Chart: 총합 세로 ──────────────────────────────────────
  function ChartTotalV(){
    const PL=44,PB=28,PT=12,PR=20,H=160;
    const nC=cycles.length;
    const W=Math.max(280, nC*70+PL+PR);
    const cW=W-PL-PR, cH=H-PB-PT;
    const xStep=cW/nC, barW=Math.min(48,(xStep*.65));
    const avgY=PT+cH-(avgTotal/maxTotal)*cH;
    return React.createElement('div',{style:{overflowX:'auto'}},
      React.createElement('svg',{width:W,height:H,style:{display:'block',overflow:'visible',minWidth:W}},
        [0,.25,.5,.75,1].map(r=>React.createElement('g',{key:r},
          React.createElement('line',{x1:PL,y1:PT+cH*(1-r),x2:W-PR,y2:PT+cH*(1-r),stroke:'#1e293b',strokeWidth:1}),
          React.createElement('text',{x:PL-4,y:PT+cH*(1-r),textAnchor:'end',dominantBaseline:'middle',fontSize:8,fill:'#475569'},fmtS(maxTotal*r)),
        )),
        ...cycles.map((c,i)=>{
          const d=cycleTotalDur(c);
          const bH=Math.max(2,(d/maxTotal)*cH);
          const bX=PL+i*xStep+(xStep-barW)/2;
          const bY=PT+cH-bH;
          return React.createElement('g',{key:c},
            React.createElement('rect',{x:bX,y:bY,width:barW,height:bH,rx:3,fill:CYCLE_COLORS[c-1],opacity:.85}),
            React.createElement('text',{x:bX+barW/2,y:bY-3,textAnchor:'middle',fontSize:9,fill:'#e2e8f0',fontWeight:700},fmtS(d)),
            React.createElement('text',{x:bX+barW/2,y:PT+cH+14,textAnchor:'middle',fontSize:9,fill:CYCLE_COLORS[c-1],fontWeight:700},`C${c}`),
          );
        }),
        React.createElement('line',{x1:PL,y1:avgY,x2:W-PR,y2:avgY,stroke:'#f59e0b',strokeWidth:1.5,strokeDasharray:'4 2'}),
        React.createElement('text',{x:W-PR+3,y:avgY,fontSize:8,fill:'#f59e0b',dominantBaseline:'middle'},'평균'),
      )
    );
  }

  // ── Chart: 총합 가로 ──────────────────────────────────────
  function ChartTotalH(){
    const PL=48,PB=20,PT=8,PR=56;
    const nC=cycles.length;
    const H=Math.max(120, nC*48+PB+PT);

    return React.createElement('svg',{width:W,height:H,style:{display:'block',overflow:'visible'}},
      [0,.25,.5,.75,1].map(r=>React.createElement('g',{key:r},
        React.createElement('line',{x1:PL+r*cW,y1:PT,x2:PL+r*cW,y2:H-PB,stroke:'#1e293b',strokeWidth:1}),
        React.createElement('text',{x:PL+r*cW,y:H-PB+12,textAnchor:'middle',fontSize:8,fill:'#475569'},fmtS(maxTotal*r)),
      )),
      ...cycles.map((c,i)=>{
        const d=cycleTotalDur(c);
        const bW=Math.max(2,(d/maxTotal)*cW);
        const bY=PT+i*yStep+(yStep-barH)/2;
        return React.createElement('g',{key:c},
          React.createElement('text',{x:PL-5,y:bY+barH/2,textAnchor:'end',dominantBaseline:'middle',fontSize:9,fill:CYCLE_COLORS[c-1],fontWeight:700},`C${c}`),
          React.createElement('rect',{x:PL,y:bY,width:bW,height:barH,rx:3,fill:CYCLE_COLORS[c-1],opacity:.85}),
          React.createElement('text',{x:PL+bW+5,y:bY+barH/2,dominantBaseline:'middle',fontSize:9,fill:'#e2e8f0',fontWeight:700},fmtS(d)),
        );
      }),
      React.createElement('line',{x1:avgX,y1:PT,x2:avgX,y2:H-PB,stroke:'#f59e0b',strokeWidth:1.5,strokeDasharray:'4 2'}),
      React.createElement('text',{x:avgX,y:PT-4,textAnchor:'middle',fontSize:8,fill:'#f59e0b'},'평균'),
    );
  }

  // ── Chart: 사이클별 누적 막대 ─────────────────────────────
  function ChartStackedCycle(){
    var _tt=React.useState(null); var tooltip=_tt[0],setTooltip=_tt[1];

              );
            }),
            React.createElement('text',{x:bX+barW/2,y:totalTop-5,textAnchor:'middle',fontSize:9,fill:'#e2e8f0',fontWeight:700},fmtS(totalDur)),
            React.createElement('text',{x:bX+barW/2,y:PT+cH+18,textAnchor:'middle',fontSize:10,fill:CYCLE_COLORS[c-1],fontWeight:700},'C'+c),

    html+='<head><meta charset="utf-8"/></head><body>';

        var d=cellDur(n,c);
        var avg=cellAvg(n); var mn=cellMin(n); var mx=cellMax(n);
        var bg=d===0?'#f1f5f9':d===mx&&mn!==mx?'#fee2e2':d===mn&&mn!==mx?'#dcfce7':'#fff';
        html+=td(d>0?d.toFixed(3):'',bg);
      });
      html+=td(cellAvg(n).toFixed(3),'#eff6ff')+td(cellMin(n).toFixed(3),'#f0fdf4')+td(cellMax(n).toFixed(3),'#fff1f2')+td(cov(n).toFixed(1)+'%','#fffbeb')+'</tr>';

      });
      html+='</table>';
    }
    html+='</body></html>';
    var blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
    var a=document.createElement('a');

// ─────────────────────────────────────────
//  E-drive File Storage (File System Access API)
// ─────────────────────────────────────────
async function _idbOpen(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('wvas_fs',1);
    r.onupgradeneeded=function(e){e.target.result.createObjectStore('handles');};
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(){rej(r.error);};
  });
}
async function idbGet(key){
  try{
    var db=await _idbOpen();
    return await new Promise(function(res){
      var tx=db.transaction('handles','readonly');
      var req=tx.objectStore('handles').get(key);
      req.onsuccess=function(){res(req.result!==undefined?req.result:null);};
      req.onerror=function(){res(null);};
    });
  }catch(e){return null;}
}
async function idbPut(key,val){
  try{
    var db=await _idbOpen();
    await new Promise(function(res){
      var tx=db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val,key);
      tx.oncomplete=function(){res();};
      tx.onerror=function(){res();};
    });
    return true;
  }catch(e){return false;}
}
async function fsPickFolder(){
  try{
    var h=await showDirectoryPicker({mode:'readwrite',startIn:'desktop'});
    await idbPut('dirHandle',h);
    return h;
  }catch(e){if(e.name!=='AbortError')alert('폴더 선택 실패: '+e.message);return null;}
}
async function fsRestoreFolder(){
  try{
    var h=await idbGet('dirHandle');
    if(!h)return null;
    var perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted')return h;
    var req2=await h.requestPermission({mode:'readwrite'});
    return req2==='granted'?h:null;
  }catch(e){return null;}
}
function fsSafeName(s){return(s||'session').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,50);}
async function fsSaveToFolder(dh,data){
  var dt=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  var label=data.analysisName||data.videoName||'session';
  var fname=fsSafeName(label)+'_'+dt+'.wvas';
  try{
    var fh=await dh.getFileHandle(fname,{create:true});
    var w=await fh.createWritable();
    await w.write(JSON.stringify(data,null,2));
    await w.close();
    return fname;

function Yamazumi(props){

  var yamaTasks=useMemo(function(){

  var _ym=useState(function(){return allVideos.length>1?'multi':'single';}); var yamaMode=_ym[0],setYamaMode=_ym[1];

  useEffect(function(){

  var multiTasks=useMemo(function(){

        merged.push({id:nm.id,name:nm.name,type:nm.type,color:nm.color,partId:nm.partId,

  // ── Violation checker ──
  function checkViolations(tasksArr){

  var currentViolations=useMemo(function(){return checkViolations(tasks);},[tasks,constraints,workers]);

  // ── Apply move with undo ──
  function applyMove(taskId, toWorker){

          var v=allVideos[i];

        }
        return toWorker;
      })();
      if(curW===toWorker) return;
      setUndoStack(function(h){return h.slice(-29).concat([{taskId:taskId,from:curW,to:toWorker,multi:true}]);});
      setRedoStack([]);
      setAssignments(function(prev){return Object.assign({},prev,{[taskId]:toWorker});});
      return;
    }
    var t=tasks.find(function(x){return x.id===taskId;});
    if(!t||t.worker===toWorker) return;
    setUndoStack(function(h){return h.slice(-29).concat([{taskId:taskId,from:t.worker,to:toWorker}]);});
    setRedoStack([]);
    setTasks(function(prev){return prev.map(function(x){return x.id===taskId?Object.assign({},x,{worker:toWorker}):x;});});
  }
  function undo(){
    if(!undoStack.length) return;
    var last=undoStack[undoStack.length-1];
    setUndoStack(function(h){return h.slice(0,-1);});
    var ids=last.taskIds||[last.taskId];
    setRedoStack(function(r){return r.concat([{taskIds:ids,from:last.to,to:last.from,multi:last.multi}]);});
    if(last.multi){setAssignments(function(prev){var n=Object.assign({},prev);ids.forEach(function(id){n[id]=last.from;});return n;});}
    else{setTasks(function(prev){return prev.map(function(x){return ids.indexOf(x.id)>=0?Object.assign({},x,{worker:last.from}):x;});});}
  }
  function redo(){
    if(!redoStack.length) return;
    var last=redoStack[redoStack.length-1];
    setRedoStack(function(r){return r.slice(0,-1);});
    var ids=last.taskIds||[last.taskId];
    setUndoStack(function(h){return h.concat([{taskIds:ids,from:last.to,to:last.from,multi:last.multi}]);});

    var curTotal=taskList.reduce(function(s,t){return s+t.avgStd;},0);

  // ── Chart data ──
  var TYPE_COLOR={'value-added':'#22c55e','auxiliary':'#facc15','waste':'#ef4444'};

function LinePredict({parts}){

  const [addPartId,setAddPartId]=useState('');

  const allSessions=useMemo(()=>lsList().map(m=>lsGet(m.id)).filter(Boolean),[]);
  const stDb=useMemo(()=>{
    const db={};
    allSessions.forEach(sess=>{
      const pid=sess.partId||'__none__';
      if(!db[pid]) db[pid]={};
      const tasks=Array.isArray(sess.videos)?sess.videos.flatMap(v=>v.tasks||[]):(sess.tasks||[]);
      tasks.forEach(t=>{if(!t.name)return;if(!db[pid][t.name])db[pid][t.name]=[];db[pid][t.name].push(t.duration);});
    });
    return db;
  },[allSessions]);
  function addItem(){
    if(!addPartId) return;
    setLineItems(prev=>{
      const exist=prev.find(i=>i.partId===addPartId);
      if(exist) return prev.map(i=>i.partId===addPartId?{...i,qty:i.qty+Number(addQty)||1}:i);
      return [...prev,{partId:addPartId,qty:Number(addQty)||1}];
    });
  }
  function removeItem(partId){setLineItems(prev=>prev.filter(i=>i.partId!==partId));}
  const workContent=useMemo(()=>{
    const t={};

      const data=stDb[partId]||{};
      Object.entries(data).forEach(([name,durs])=>{
        const avg=durs.reduce((s,d)=>s+d,0)/durs.length;
        t[name]=(t[name]||0)+avg*qty;

            React.createElement('option',{value:''},'부품 선택...'),

// Error boundary for debugging
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return React.createElement('div',{style:{color:'#f87171',padding:24,fontFamily:'monospace',background:'#0f172a',minHeight:'100vh'}},
      React.createElement('h2',{style:{marginBottom:8}},'React Render Error'),

      React.createElement('pre',{style:{fontSize:11,whiteSpace:'pre-wrap'}},this.state.err.stack)
    );
    return this.props.children;
  }
}

// ── BottleneckChart ──────────────────────────────────────────────────────────
function BottleneckChart(props){
  var model=props.model;
  if(!model||!model.processes||model.processes.length===0) return null;
  var procs=model.processes.slice().sort(function(a,b){return(a.order||0)-(b.order||0);});
  var takt=model.taktTime||60;
  var maxTime=Math.max.apply(null,procs.map(function(p){return p.stdTimeTotal||0;}).concat([takt]))*1.2||120;
  var bottleneckId=procs.reduce(function(a,b){return(a.stdTimeTotal||0)>=(b.stdTimeTotal||0)?a:b;},{}).id;

  return React.createElement('div',{style:{marginTop:12}},
    React.createElement('div',{style:{fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:8}},
      '📊 공정별 표준시간 비교 (병목 분석)'
    ),
    React.createElement('div',{style:{background:'#0f172a',borderRadius:8,padding:'12px 14px'}},
      procs.map(function(p){
        var t=p.stdTimeTotal||0;
        var pct=Math.min(t/maxTime*100,100);
        var isBN=p.id===bottleneckId&&t>0;
        var overTakt=t>takt;
        var color=overTakt?'#ef4444':isBN?'#f59e0b':'#22c55e';
        return React.createElement('div',{key:p.id,style:{marginBottom:10}},
          React.createElement('div',{style:{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}},
            React.createElement('span',{style:{color:isBN?'#fbbf24':'#e2e8f0',fontWeight:isBN?700:400}},
              (isBN?'🔴 ':'🟢 ')+p.name+(overTakt?' ⚠ 택트 초과':isBN?' ← 병목':'')
            ),
            React.createElement('span',{style:{color:color,fontWeight:600}},t.toFixed(1)+'s')
          ),
          React.createElement('div',{style:{height:18,background:'#1e293b',borderRadius:4,position:'relative',overflow:'hidden'}},
            React.createElement('div',{style:{height:'100%',width:pct+'%',background:color,borderRadius:4,transition:'width 0.5s ease'}}),
            React.createElement('div',{style:{
              position:'absolute',top:0,left:(takt/maxTime*100)+'%',
              width:2,height:'100%',background:'#f43f5e',
            }}),
            React.createElement('span',{style:{
              position:'absolute',top:1,right:4,fontSize:10,color:'#475569'
            }},p.cycleCount?p.cycleCount+'사이클':'')
          )

        React.createElement('div',{style:{width:20,height:2,background:'#f43f5e'}}),
        React.createElement('span',null,'택트타임: '+takt+'s'),
        React.createElement('div',{style:{width:10,height:10,background:'#22c55e',borderRadius:2,marginLeft:12}}),
        React.createElement('span',null,'정상'),
        React.createElement('div',{style:{width:10,height:10,background:'#f59e0b',borderRadius:2,marginLeft:6}}),
        React.createElement('span',null,'병목'),
        React.createElement('div',{style:{width:10,height:10,background:'#ef4444',borderRadius:2,marginLeft:6}}),
        React.createElement('span',null,'택트 초과')

function AiAnalysisModal(props){
  // props: onClose, onApply, videoFiles (Map: id->File), activeVideoId, videoName
  var useState=React.useState, useRef=React.useRef, useEffect=React.useEffect;
  var _su=useState('http://localhost:8000'); var serverUrl=_su[0],setServerUrl=_su[1];
  var _sf=useState(5);   var sampleFps=_sf[0],setSampleFps=_sf[1];
  var _si=useState(1.5); var idleThr=_si[0],setIdleThr=_si[1];
  var _sm=useState(1.0); var minSeg=_sm[0],setMinSeg=_sm[1];
  var _sy=useState(true);var useYolo=_sy[0],setUseYolo=_sy[1];
  var _sp=useState(0);   var progress=_sp[0],setProgress=_sp[1];
  var _ss=useState('대기 중...'); var status=_ss[0],setStatus=_ss[1];
  var _sb=useState(false); var busy=_sb[0],setBusy=_sb[1];
  var _sr=useState(null);  var result=_sr[0],setResult=_sr[1];
  var _se=useState('');    var errMsg=_se[0],setErrMsg=_se[1];
  var _sh=useState(null);  var health=_sh[0],setHealth=_sh[1];
  var abortRef=useRef(null);

  // 서버 상태 자동 체크
  useEffect(function(){
    var t=setTimeout(function(){checkHealth(serverUrl).then(function(h){setHealth(h);});},300);
    return function(){clearTimeout(t);};
  },[serverUrl]);

  function checkHealth(url){
    return fetch(url+'/health',{signal:AbortSignal.timeout(3000)})
      .then(function(r){return r.json();})
      .catch(function(){return null;});
  }

  function startAnalysis(){
    var videoFile=props.videoFiles&&props.videoFiles.get(props.activeVideoId);
    if(!videoFile){
      setErrMsg('❌ 분석할 영상 파일이 없습니다. 먼저 영상을 불러오세요.');
      return;
    }
    setBusy(true); setErrMsg(''); setResult(null); setProgress(2); setStatus('서버 연결 중...');

    var ctrl=new AbortController(); abortRef.current=ctrl;
    var fd=new FormData();
    fd.append('file',videoFile);
    fd.append('sample_fps',String(sampleFps));
    fd.append('idle_threshold',String(idleThr));
    fd.append('min_segment',String(minSeg));
    fd.append('use_yolo',useYolo?'true':'false');
    fd.append('worker_id','W1');

    // SSE streaming approach
    var es=null;

    // Use fetch + ReadableStream for SSE with POST body
    setStatus('영상 업로드 중...');
    setProgress(5);

    fetch(serverUrl+'/analyze/stream',{method:'POST',body:fd,signal:ctrl.signal})
      .then(function(res){
        if(!res.ok) return res.json().then(function(e){throw new Error(e.error||'HTTP '+res.status);});
        setProgress(10); setStatus('AI 분석 시작...');
        var reader=res.body.getReader(); var dec=new TextDecoder(); var buf='';
        function pump(){
          return reader.read().then(function(d){
            if(d.done) return;
            buf+=dec.decode(d.value,{stream:true});
            var lines=buf.split('\n'); buf=lines.pop();
            lines.forEach(function(line){
              if(!line.startsWith('data:')) return;
              var raw=line.slice(5).trim();
              if(raw==='[DONE]') return;
              try{
                var obj=JSON.parse(raw);
                if(obj.progress!=null) setProgress(obj.progress);
                if(obj.status)   setStatus(obj.status);
                if(obj.result){
                  if(obj.result.error){ setErrMsg('❌ '+obj.result.error); setBusy(false); }
                  else { setResult(obj.result); setBusy(false); setProgress(100); setStatus('분석 완료!'); }
                }
              }catch(e2){}
            });
            return pump();
          });
        }
        return pump();
      })
      .catch(function(e){
        if(e.name!=='AbortError') setErrMsg('❌ '+e.message);
        setBusy(false);
      });
  }

  function cancel(){

// ─── Segment Compare Modal (낭비 비교 / 사이클 비교) ──────────────────

function CycleStats(props){
  var tasks=props.tasks,workers=props.workers,taktTime=props.taktTime,
      ratingFactor=props.ratingFactor,allowanceRate=props.allowanceRate,
      beforeSnap=props.beforeSnap,parts=props.parts||[];
  var useState=React.useState;
  var _sv=useState('all'); var filterMode=_sv[0],setFilterMode=_sv[1];

  var WASTE_TYPE_LBL={'wait':'대기','transport':'이동/운반','motion':'불필요동작','overprocess':'과잉공정','defect':'불량/재작업'};
  var TYPE_COLOR={'value-added':'#22c55e','auxiliary':'#f59e0b','waste':'#ef4444'};

  if(!tasks||!tasks.length){
    return React.createElement('div',{
      style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',
             color:'#475569',fontSize:'14px'}
    },'분석할 작업 데이터가 없습니다. 영상에서 작업을 마킹해주세요.');
  }

  function calcCycleData(taskArr){
    var cnums=[...new Set(taskArr.map(function(t){return t.cycle||1;}))].sort(function(a,b){return a-b;});
    return cnums.map(function(c){
      var ct=taskArr.filter(function(t){return(t.cycle||1)===c;});
      var obs=ct.reduce(function(s,t){return s+t.duration;},0);
      var std=obs*(ratingFactor/100)*(1+allowanceRate/100);
      var va=ct.filter(function(t){return t.type==='value-added';}).reduce(function(s,t){return s+t.duration;},0);
      var aux=ct.filter(function(t){return t.type==='auxiliary';}).reduce(function(s,t){return s+t.duration;},0);
      var wst=ct.filter(function(t){return t.type==='waste';}).reduce(function(s,t){return s+t.duration;},0);
      var waitT=ct.filter(function(t){return t.wasteType==='wait';}).reduce(function(s,t){return s+t.duration;},0);
      return{c:c,obs:obs,std:std,count:ct.length,va:va,aux:aux,wst:wst,waitT:waitT};
    });
  }

  var cycleData=calcCycleData(tasks);
  var n=cycleData.length;
  var vals=cycleData.map(function(d){return d.obs;});
  var mean=vals.reduce(function(s,v){return s+v;},0)/n;
  var variance=vals.reduce(function(s,v){return s+(v-mean)*(v-mean);},0)/n;
  var stdDev=Math.sqrt(variance);
  var cv=n>1?stdDev/mean*100:0;
  var sorted=[...vals].sort(function(a,b){return a-b;});
  var median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
  var minV=sorted[0],maxV=sorted[n-1];

  cycleData.forEach(function(d){
    d.isOutlier=n>3&&Math.abs(d.obs-mean)>2*stdDev;
    d.isBest=d.obs===minV;
    d.aboveTarget=d.obs>taktTime;
  });

  var normal=cycleData.filter(function(d){return!d.isOutlier;});

// ─────────────────────────────────────────
//  ReportModal — 산출보고서
// ─────────────────────────────────────────
function ReportModal({tasks,videos,taktTime,workers,ratingFactor,allowanceRate,lang,onClose}){
  var s=STRINGS[lang]||STRINGS.ko;
  var _scr=useState({}); var screenshots=_scr[0],setScreenshots=_scr[1];
  var _cap=useState(false); var capturing=_cap[0],setCapturing=_cap[1];
  var _capIdx=useState(-1); var capIdx=_capIdx[0],setCapIdx=_capIdx[1];
  var hiddenVideoRef=useRef(null);
  var hiddenCanvasRef=useRef(null);

  // ── Derived stats ──────────────────────────────────────────
  var rf=(ratingFactor||100)/100, ar=(allowanceRate||0)/100;
  function stdOf(dur){ return dur*rf*(1+ar); }

  var names=useMemo(function(){
    var seen=new Set(),order=[];
    tasks.slice().sort(function(a,b){return a.startTime-b.startTime;}).forEach(function(t){
      if(!seen.has(t.name)){seen.add(t.name);order.push(t.name);}
    });
    return order;
  },[tasks]);

  var cycles=useMemo(function(){
    var s=new Set(tasks.map(function(t){return t.cycle||1;}));
    return Array.from(s).sort(function(a,b){return a-b;});
  },[tasks]);

  // matrix[name][cycle] = [tasks]
  var matrix=useMemo(function(){
    var m={};
    names.forEach(function(n){
      m[n]={};
      cycles.forEach(function(c){m[n][c]=[];});
    });
    tasks.forEach(function(t){
      var n=t.name,c=t.cycle||1;
      if(m[n]&&m[n][c]!==undefined)m[n][c].push(t);
    });
    return m;
  },[tasks,names,cycles]);

  function cellDur(n,c){return(matrix[n]&&matrix[n][c]?matrix[n][c]:[]).reduce(function(s,t){return s+t.duration;},0);}
  function nameAvg(n){return cycles.length>0?cycles.reduce(function(s,c){return s+cellDur(n,c);},0)/cycles.length:0;}
  function nameCov(n){
    var avg=nameAvg(n); if(!avg)return 0;
    var variance=cycles.reduce(function(s,c){return s+Math.pow(cellDur(n,c)-avg,2);},0)/cycles.length;
    return (Math.sqrt(variance)/avg)*100;
  }
  function nameMin(n){return cycles.length>0?Math.min.apply(null,cycles.map(function(c){return cellDur(n,c);})):0;}
  function nameMax(n){return cycles.length>0?Math.max.apply(null,cycles.map(function(c){return cellDur(n,c);})):0;}

  // First occurrence of each task name → for screenshots
  var firstByName=useMemo(function(){
    var m={};
    tasks.slice().sort(function(a,b){return a.startTime-b.startTime;}).forEach(function(t){
      if(m[t.name]===undefined)m[t.name]=t;
    });
    return m;
  },[tasks]);

  // Type time sums
  var typeSums={value:0,auxiliary:0,waste:0};
  names.forEach(function(n){
    var avg=nameAvg(n);
    var firstTask=firstByName[n];
    var tp=firstTask?firstTask.type:'value-added';
    if(tp==='value-added'||tp==='value')typeSums.value+=avg;
    else if(tp==='auxiliary')typeSums.auxiliary+=avg;
    else if(tp==='waste')typeSums.waste+=avg;
  });
  var totalTypeST=typeSums.value+typeSums.auxiliary+typeSums.waste;

  // Total ST (avg per cycle × rating × allowance), per worker
  var workerSTMap={};
  names.forEach(function(n){
    var firstTask=firstByName[n];
    var w=firstTask?firstTask.worker:'W1';
    var st=stdOf(nameAvg(n));
    workerSTMap[w]=(workerSTMap[w]||0)+st;
  });
  var totalST=Object.values(workerSTMap).reduce(function(s,v){return s+v;},0);
  var workerCount=workers?workers.length:Object.keys(workerSTMap).length||1;
  var minHeadcount=taktTime>0?Math.ceil(totalST/taktTime):'-';
  var maxWorkerST=Math.max.apply(null,Object.values(workerSTMap).concat([0]));
  var lbe=workerCount>0&&maxWorkerST>0?Math.round(totalST/(workerCount*maxWorkerST)*100):0;

  // ── SVG Pie chart ──────────────────────────────────────────
  function pieSlices(){
    var data=[
      {label:'정미작업',val:typeSums.value,color:'#22c55e'},
      {label:'부수작업',val:typeSums.auxiliary,color:'#3b82f6'},
      {label:'낭비',val:typeSums.waste,color:'#ef4444'},
    ];
    var total=totalTypeST||1;
    var start=-90,slices=[];
    data.forEach(function(d){
      var deg=(d.val/total)*360;
      slices.push({label:d.label,val:d.val,color:d.color,start:start,end:start+deg,pct:Math.round(d.val/total*100)});
      start+=deg;
    });
    return slices;
  }
  function polarXY(cx,cy,r,deg){
    var rad=(deg)*Math.PI/180;
    return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
  }
  function arcD(cx,cy,r,startDeg,endDeg){
    var s=polarXY(cx,cy,r,startDeg);
    var e=polarXY(cx,cy,r,endDeg);
    var large=endDeg-startDeg>180?1:0;
    if(endDeg-startDeg>=359.9)return 'M '+cx+' '+cy+' m -'+r+' 0 a '+r+' '+r+' 0 1 0 '+(r*2)+' 0 a '+r+' '+r+' 0 1 0 -'+(r*2)+' 0';
    return 'M '+cx+' '+cy+' L '+s.x.toFixed(2)+' '+s.y.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+e.x.toFixed(2)+' '+e.y.toFixed(2)+' Z';
  }

  // ── Video screenshot capture ───────────────────────────────
  var firstVideoFile=useMemo(function(){
    var v=videos.find(function(v){return v.file;});
    return v?v.file:null;
  },[videos]);

  var captureQueue=useRef([]);
  var captureResults=useRef({});

  function startCapture(){
    if(!firstVideoFile||names.length===0){return;}
    var vid=hiddenVideoRef.current;
    var cvs=hiddenCanvasRef.current;
    if(!vid||!cvs)return;
    setCapturing(true);
    setScreenshots({});
    captureResults.current={};
    captureQueue.current=names.filter(function(n){
      var t=firstByName[n];return t&&t.startTime>=0;
    });
    var url=URL.createObjectURL(firstVideoFile);
    vid._blobUrl=url;
    vid.src=url;
    vid.load();
  }

  useEffect(function(){
    var vid=hiddenVideoRef.current;
    var cvs=hiddenCanvasRef.current;
    if(!vid||!cvs||!capturing)return;

    function doNext(){
      var queue=captureQueue.current;
      if(queue.length===0){
        setScreenshots(Object.assign({},captureResults.current));
        setCapturing(false);
        setCapIdx(-1);
        if(vid._blobUrl)URL.revokeObjectURL(vid._blobUrl);
        return;
      }
      var n=queue.shift();
      var t=firstByName[n];
      setCapIdx(names.indexOf(n));
      vid.currentTime=t?t.startTime:0;
    }

    function onLoaded(){vid.removeEventListener('loadeddata',onLoaded);doNext();}
    function onSeeked(){
      var n=names[capIdx<0?0:capIdx];
      // find which name we just seeked for
      var remaining=captureQueue.current;
      // we already shifted it off; use capIdx
      // Actually, figure out by seeing what name was shifted
      // Re-approach: capture the name before shift using closure
    }

    // Use a simpler approach with seeked event
    function handleSeeked(){
      var w=vid.videoWidth||320, h=vid.videoHeight||180;
      cvs.width=w; cvs.height=h;
      cvs.getContext('2d').drawImage(vid,0,0,w,h);
      var dataUrl=cvs.toDataURL('image/jpeg',0.7);
      // find which task this was for: videoRef._pendingName
      var pname=vid._pendingName;
      if(pname){captureResults.current[pname]=dataUrl;}
      doNext();
    }

    function overrideDoNext(){
      var queue=captureQueue.current;
      if(queue.length===0){
        setScreenshots(Object.assign({},captureResults.current));
        setCapturing(false);
        setCapIdx(-1);
        if(vid._blobUrl)URL.revokeObjectURL(vid._blobUrl);
        vid.removeEventListener('seeked',handleSeeked2);
        return;
      }
      var n=queue.shift();
      var t=firstByName[n];
      vid._pendingName=n;
      setCapIdx(names.indexOf(n));
      vid.currentTime=t?t.startTime:0;
    }

    function handleSeeked2(){
      var w=vid.videoWidth||320, h=vid.videoHeight||180;
      cvs.width=w; cvs.height=h;
      cvs.getContext('2d').drawImage(vid,0,0,w,h);
      var dataUrl=cvs.toDataURL('image/jpeg',0.7);
      var pname=vid._pendingName;
      if(pname){captureResults.current[pname]=dataUrl;}
      overrideDoNext();
    }

    vid.addEventListener('seeked',handleSeeked2);

    setVideos(prev=>prev.map(v=>v.id===vid?{...v,src,file}:v));
    if(vid===activeVideoId){setVideoSrc(src);setVideoName(file.name);}
  }
  function switchToVideo(v){
    if(v.id===activeVideoId) return;
    setVideos(prev=>prev.map(p=>p.id===activeVideoId?{...p,tasks,fps}:p));
    setVideoSrc(v.src||null);setVideoName(v.name);setTasks(v.tasks||[]);setFps(v.fps||30);
    setPending(null);setActiveTask(null);loopRef.current=null;setActiveVideoId(v.id);setCurrentCycle(1);
  }
  function removeVideo(id){
    setVideos(prev=>{
      const remaining=prev.filter(v=>v.id!==id);
      if(id===activeVideoId){
        if(remaining.length){
          const nv=remaining[0];
          setVideoSrc(nv.src||null);setVideoName(nv.name);setTasks(nv.tasks||[]);setFps(nv.fps||30);
          setPending(null);setActiveTask(null);loopRef.current=null;setActiveVideoId(nv.id);
        } else {
          setVideoSrc(null);setVideoName('');setTasks([]);setPending(null);setActiveTask(null);loopRef.current=null;setActiveVideoId(null);
        }
      }
      return remaining;
    });
  }
  function markCompleted(){
    if(!activeVideoId) return;
    setVideos(prev=>prev.map(v=>v.id===activeVideoId?{...v,tasks,fps,completed:true}:v));
  }
  function togglePlay(){ const v=videoRef.current; if(v) v.paused?v.play():v.pause(); }
  function stepFrame(d){ const v=videoRef.current; if(!v) return; v.pause(); v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d/fps)); }
  function changeSpeed(s){ setSpeed(s); if(videoRef.current) videoRef.current.playbackRate=s; }
  function seekTo(t){ if(videoRef.current) videoRef.current.currentTime=t; }
  function wheelSeek(d){ const v=videoRef.current; if(v) v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d)); }
  function handleClick(){ const v=videoRef.current; if(!v) return; if(pending===null){ setPending(v.currentTime); v.play(); } else finishMark(); }
  function finishMark(){
    const v=videoRef.current; if(!v||pending===null) return;
    const endTime=v.currentTime;
    if(endTime<=pending){alert('종료 시점이 시작 시점보다 앞에 있습니다.');return;}
    v.pause();
    setTasks(prev=>{
      const cycleTaskCount=prev.filter(t=>(t.cycle||1)===currentCycle).length;
      const cycle1Tasks=prev.filter(t=>(t.cycle||1)===1).sort((a,b)=>a.startTime-b.startTime);
      const tmpl=currentCycle>1?(cycle1Tasks[cycleTaskCount]||null):null;
      const color=tmpl?tmpl.color:TASK_COLORS[cycleTaskCount%TASK_COLORS.length];
      const newTask={id:uid(),name:tmpl?tmpl.name:`작업 ${cycleTaskCount+1}`,type:tmpl?tmpl.type:'value-added',color,cycle:currentCycle,startTime:pending,endTime,duration:endTime-pending,note:'',worker:activeWorker,partId:tmpl?tmpl.partId:(selectedPartId||null)};
      return [...prev,newTask].sort((a,b)=>a.startTime-b.startTime);
    });
    setPending(null);
  }
  function deleteLastMark(){
    var v=videoRef.current;
    var c=currentCycle;
    setTasks(function(prev){
      var cycleTasks=prev.filter(function(t){return(t.cycle||1)===c;});
      if(!cycleTasks.length) return prev;
      var last=cycleTasks.slice().sort(function(a,b){return b.endTime-a.endTime;})[0];
      var remaining=prev.filter(function(t){return t.id!==last.id;});
      var cycleRem=remaining.filter(function(t){return(t.cycle||1)===c;});
      var prevEnd=cycleRem.length>0
        ?Math.max.apply(null,cycleRem.map(function(t){return t.endTime;}))
        :0;
      if(v){v.currentTime=prevEnd;v.pause();}
      return remaining;
    });
    setPending(null);
    setActiveTask(null);
    loopRef.current=null;
  }
  function copyCycleTemplate(){
    setTasks(function(prev){
      var c1=prev.filter(function(t){return(t.cycle||1)===1;})
               .sort(function(a,b){return a.startTime-b.startTime;});
      if(!c1.length) return prev;
      return prev.map(function(t){
        var c=t.cycle||1;
        if(c===1) return t;
        var cycleTasks=prev.filter(function(x){return(x.cycle||1)===c;})
                           .sort(function(a,b){return a.startTime-b.startTime;});
        var idx=cycleTasks.findIndex(function(x){return x.id===t.id;});
        var tmpl=c1[idx];
        if(!tmpl) return t;
        return Object.assign({},t,{name:tmpl.name,color:tmpl.color,type:tmpl.type,partId:tmpl.partId||t.partId||null});
      });
    });
  }
  function loopTask(task){ const v=videoRef.current; if(!v) return; setActiveTask(task.id); loopRef.current={start:task.startTime,end:task.endTime}; v.currentTime=task.startTime; v.play(); }
  function clearLoop(){ setActiveTask(null); loopRef.current=null; }
  function updateTask(id,field,value){ setTasks(prev=>prev.map(t=>{ if(t.id!==id) return t; const u={...t,[field]:value}; if(field==='startTime'||field==='endTime') u.duration=Math.max(0,u.endTime-u.startTime); return u; })); }
  function deleteTask(id){ setTasks(prev=>prev.filter(t=>t.id!==id)); if(activeTask===id) clearLoop(); }
  function doAutoAssign(){ setTasks(prev=>autoAssignCycles(prev)); }

  // ── Standard time ──────────────────────────────────────────────────────────
  function stdTime(obs){ return obs*(ratingFactor/100)*(1+allowanceRate/100); }
  function fmtStd(obs){ return fmt(stdTime(obs)); }

  // ── Idle time auto-detect ─────────────────────────────────────────────────
  function detectIdleTasks(){
    var added=0;
    var newTasks=tasks.slice();
    var cycleNums=[...new Set(tasks.map(function(t){return t.cycle||1;}))];
    cycleNums.forEach(function(c){
      var ct=tasks.filter(function(t){return(t.cycle||1)===c;}).sort(function(a,b){return a.startTime-b.startTime;});
      for(var i=1;i<ct.length;i++){
        var gap=ct[i].startTime-ct[i-1].endTime;
        if(gap>=idleThreshold){
          var dup=newTasks.find(function(t){return t.wasteType==='wait'&&Math.abs(t.startTime-ct[i-1].endTime)<0.05;});
          if(!dup){
            newTasks.push({id:uid(),name:'대기',type:'waste',wasteType:'wait',
              color:'#f87171',cycle:c,startTime:ct[i-1].endTime,endTime:ct[i].startTime,
              duration:gap,note:'자동감지',worker:ct[i-1].worker||activeWorker});
            added++;
          }
        }
      }
    });
    if(added>0) setTasks(newTasks.sort(function(a,b){return a.startTime-b.startTime;}));
    alert(added>0?added+'개 대기구간이 추가됐습니다. (기준:'+idleThreshold+'s이상)':'감지된 대기시간 없음 (기준:'+idleThreshold+'s이상)');
  }

  // ── Before/After snapshot ─────────────────────────────────────────────────
  function saveBeforeSnap(){
    setBeforeSnap({tasks:JSON.parse(JSON.stringify(tasks)),workers:workers.slice(),taktTime:taktTime});
    alert('현재 배치를 개선전 기준으로 저장했습니다.');
  }

  function exportCSV(){
    const allVids=videos.length>0
      ?videos.map(v=>({name:v.name,tasks:v.id===activeVideoId?tasks:v.tasks}))
      :[{name:videoName,tasks}];
    const multi=allVids.length>1;
    const header=multi?['영상','#','작업명','사이클','분류','시작(s)','종료(s)','소요(s)','소요(hh:mm:ss)','비고']:['#','작업명','사이클','분류','시작(s)','종료(s)','소요(s)','소요(hh:mm:ss)','비고'];
    const dataRows=[];
    allVids.forEach(vid=>vid.tasks.forEach((t,i)=>{
      const row=[i+1,t.name,t.cycle||1,TT[t.type].label,t.startTime.toFixed(3),t.endTime.toFixed(3),t.duration.toFixed(3),fmt(t.duration,false),t.note||''];
      dataRows.push(multi?[vid.name,...row]:row);

  // ── SOP: best cycle ──────────────────────────────────────────────────────
  function sopCalcBestCycle(){
    if(!tasks.length) return null;
    var totals={};
    tasks.forEach(function(t){
      var c=t.cycle||1;
      totals[c]=(totals[c]||0)+t.duration;
    });
    var entries=Object.entries(totals).sort(function(a,b){return a[1]-b[1];});
    if(!entries.length) return null;
    return {cycle:Number(entries[0][0]),total:entries[0][1]};
  }

  // ── SOP: capture one frame ────────────────────────────────────────────────
  function sopSeekCapture(video,canvas,ctx,time){
    return new Promise(function(resolve){
      var timeout=setTimeout(function(){
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      },2000);
      function onSeeked(){
        clearTimeout(timeout);
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      }
      video.addEventListener('seeked',onSeeked,{once:true});
      video.currentTime=time;
    });
  }

  // ── SOP: main export function ─────────────────────────────────────────────
  async function exportSOP(){
    var info=sopCalcBestCycle();
    if(!info){alert('분석된 작업 데이터가 없습니다.');return;}
    var bestTasks=tasks
      .filter(function(t){return(t.cycle||1)===info.cycle;})
      .sort(function(a,b){return a.startTime-b.startTime;});
    if(!bestTasks.length){alert('베스트 사이클의 작업이 없습니다.');return;}

    cancelSopRef.current=false;
    setSopDone(false);
    setSopProgress(0);
    setSopStatus('시작 중...');
    setSopResult(null);
    setShowSopModal(true);

    // ── Capture frames ──────────────────────────────────────────────────────
    var frames=[];
    var video=videoRef.current;
    var hasVideo=video&&video.readyState>=1&&video.src&&!video.src.startsWith('data:');
    if(hasVideo){
      var origTime=video.currentTime;
      video.pause();
      var canvas=document.createElement('canvas');
      canvas.width=480;canvas.height=270;
      var ctx=canvas.getContext('2d');
      for(var i=0;i<bestTasks.length;i++){
        if(cancelSopRef.current){setShowSopModal(false);return;}
        setSopProgress(Math.round((i/bestTasks.length)*65));
        setSopStatus('프레임 캡처 '+( i+1)+'/'+bestTasks.length);
        try{
          var f=await sopSeekCapture(video,canvas,ctx,bestTasks[i].startTime);
          frames.push(f);
        }catch(e){frames.push(null);}
        await new Promise(function(r){setTimeout(r,60);});
      }
      try{video.currentTime=origTime;}catch(e){}
    } else {
      bestTasks.forEach(function(){frames.push(null);});
    }
    if(cancelSopRef.current){setShowSopModal(false);return;}

    setSopProgress(80);setSopStatus('PDF 생성 중...');
    var pdf=null;
    try{pdf=sopBuildPdf(info.cycle,bestTasks,frames,info.total);}
    catch(e){console.error('PDF error:',e);}

    setSopProgress(92);setSopStatus('Excel 생성 중...');
    var excelHtml=sopBuildExcel(info.cycle,bestTasks,frames,info.total);

    setSopProgress(100);setSopStatus('완료!');
    setSopResult({pdf,excelHtml,cycle:info.cycle,tasks:bestTasks,total:info.total});
    setSopDone(true);
  }

  // ── SOP: PDF builder (English labels — avoids CJK font issue) ─────────────
  function sopBuildPdf(cycleNum,bestTasks,frames,totalTime){
    if(!window.jspdf) throw new Error('jsPDF not loaded');
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF('p','mm','a4');
    var PW=210,PH=297,ML=10,MR=10,MT=12,MB=12;
    var CW=PW-ML-MR;

    // header bar
    pdf.setFillColor(30,64,175);
    pdf.rect(0,0,PW,24,'F');
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(17);pdf.setFont('helvetica','bold');
    pdf.text('Work Standard (SOP)',ML,15);
    pdf.setFontSize(8.5);pdf.setFont('helvetica','normal');
    var now=new Date();
    var ds=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();
    var vn=(videoName||'N/A');
    if(vn.length>35)vn=vn.slice(0,34)+'...';
    pdf.text('Best Cycle: #'+cycleNum+'  |  Date: '+ds+'  |  Video: '+vn,ML,21);

    // column widths
    var C_NO=9,C_IMG=54,C_NAME=58,C_DUR=18,C_TYPE=17,C_WKR=22;
    var C_NOTE=CW-C_NO-C_IMG-C_NAME-C_DUR-C_TYPE-C_WKR;
    var HDR_H=8,ROW_H=32;
    var y=28;

    function drawHeader(y2){
      pdf.setFillColor(241,245,249);pdf.rect(ML,y2,CW,HDR_H,'F');
      pdf.setDrawColor(226,232,240);pdf.setLineWidth(0.2);pdf.rect(ML,y2,CW,HDR_H,'S');
      pdf.setTextColor(30,41,59);pdf.setFontSize(8);pdf.setFont('helvetica','bold');
      var x=ML,labels=[['No.',C_NO],['Image',C_IMG],['Task Name',C_NAME],
                         ['Time(s)',C_DUR],['Type',C_TYPE],['Worker',C_WKR],['Note / Key Point',C_NOTE]];
      labels.forEach(function(l){pdf.text(l[0],x+l[1]/2,y2+5.5,{align:'center'});x+=l[1];});
    }
    drawHeader(y);y+=HDR_H;

    var TC={'value-added':[34,197,94],'auxiliary':[250,204,21],'waste':[239,68,68]};
    var TL={'value-added':'Value-Added','auxiliary':'Auxiliary','waste':'Waste'};

    bestTasks.forEach(function(t,ri){
      if(y+ROW_H>PH-MB-14){
        pdf.addPage();y=MT;drawHeader(y);y+=HDR_H;
      }
      var tc=TC[t.type]||[148,163,184];
      // row bg
      pdf.setFillColor(ri%2===0?255:248,ri%2===0?255:250,ri%2===0?255:252);
      pdf.rect(ML,y,CW,ROW_H,'F');
      // type color left bar
      pdf.setFillColor(tc[0],tc[1],tc[2]);pdf.rect(ML,y,2.5,ROW_H,'F');
      // row border
      pdf.setDrawColor(226,232,240);pdf.setLineWidth(0.18);pdf.rect(ML,y,CW,ROW_H,'S');

      var cx=ML;
      // No.
      pdf.setFontSize(12);pdf.setFont('helvetica','bold');pdf.setTextColor(30,41,59);
      pdf.text(String(ri+1),cx+C_NO/2,y+ROW_H/2+2,{align:'center'});
      cx+=C_NO;
      // Image
      var imgX=cx+1,imgY=y+2,imgW=C_IMG-2,imgH=ROW_H-4;
      if(frames[ri]){
        try{pdf.addImage(frames[ri],'JPEG',imgX,imgY,imgW,imgH);}
        catch(e){
          pdf.setFillColor(15,23,42);pdf.rect(imgX,imgY,imgW,imgH,'F');
          pdf.setFontSize(6);pdf.setTextColor(100,116,139);
          pdf.text('frame error',imgX+imgW/2,imgY+imgH/2,{align:'center'});
        }
      } else {
        pdf.setFillColor(15,23,42);pdf.rect(imgX,imgY,imgW,imgH,'F');
        pdf.setFontSize(6);pdf.setTextColor(100,116,139);
        pdf.text('no video',imgX+imgW/2,imgY+imgH/2,{align:'center'});
      }
      cx+=C_IMG;
      // Task name
      var tx=cx+3,ty=y+7;
      pdf.setFontSize(9);pdf.setFont('helvetica','bold');pdf.setTextColor(15,23,42);
      var nm=t.name||'';if(nm.length>22)nm=nm.slice(0,21)+'...';
      pdf.text(nm,tx,ty);
      pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.setTextColor(100,116,139);
      pdf.text((t.startTime||0).toFixed(2)+'s ~ '+(t.endTime||0).toFixed(2)+'s',tx,ty+5);
      cx+=C_NAME;
      // Duration
      pdf.setFontSize(13);pdf.setFont('helvetica','bold');pdf.setTextColor(15,23,42);
      pdf.text(t.duration.toFixed(2),cx+C_DUR/2,y+ROW_H/2+1,{align:'center'});
      pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.setTextColor(100,116,139);
      pdf.text('sec',cx+C_DUR/2,y+ROW_H/2+6,{align:'center'});
      cx+=C_DUR;
      // Type badge
      var bx=cx+1,bw=C_TYPE-2;
      pdf.setFillColor(tc[0],tc[1],tc[2]);
      pdf.roundedRect(bx,y+ROW_H/2-4,bw,8,2,2,'F');
      pdf.setFontSize(7);pdf.setFont('helvetica','bold');
      pdf.setTextColor(tc[0]>180&&tc[1]<100?255:20,tc[2]<50?255:20,20);
      pdf.setTextColor(30,30,30);
      pdf.text(TL[t.type]||t.type,bx+bw/2,y+ROW_H/2+2,{align:'center'});
      cx+=C_TYPE;
      // Worker
      pdf.setFontSize(8);pdf.setFont('helvetica','normal');pdf.setTextColor(71,85,105);
      var wn=(workers.find(function(w){return w.id===t.worker;})||{}).name||t.worker||'-';
      if(wn.length>10)wn=wn.slice(0,9)+'...';
      pdf.text(wn,cx+2,y+ROW_H/2+2);
      cx+=C_WKR;
      // Note
      if(t.note){
        pdf.setFontSize(7.5);pdf.setFont('helvetica','normal');pdf.setTextColor(71,85,105);
        var ns=t.note;if(ns.length>28)ns=ns.slice(0,27)+'...';
        pdf.text(ns,cx+2,y+ROW_H/2-1);
      }
      // key-point underline
      pdf.setDrawColor(203,213,225);pdf.setLineWidth(0.15);
      pdf.line(cx+2,y+ROW_H-6,cx+C_NOTE-2,y+ROW_H-6);
      pdf.setFontSize(6.5);pdf.setTextColor(148,163,184);
      pdf.text('Key Point:',cx+2,y+ROW_H-8);
      y+=ROW_H;
    });

    // footer summary
    if(y+14>PH-MB){pdf.addPage();y=MT;}
    y+=3;
    pdf.setFillColor(30,64,175);pdf.rect(ML,y,CW,13,'F');
    pdf.setTextColor(255,255,255);pdf.setFontSize(9);pdf.setFont('helvetica','bold');
    var vaT=bestTasks.filter(function(t){return t.type==='value-added';}).reduce(function(s,t){return s+t.duration;},0);
    var wxT=bestTasks.filter(function(t){return t.type==='waste';}).reduce(function(s,t){return s+t.duration;},0);
    var axT=totalTime-vaT-wxT;
    pdf.text(
      'Total: '+totalTime.toFixed(2)+'s  |  Value-Added: '+vaT.toFixed(2)+'s ('+Math.round(vaT/totalTime*100)+'%)'+
      '  |  Aux: '+axT.toFixed(2)+'s  |  Waste: '+wxT.toFixed(2)+'s',
      ML+4,y+8
    );
    // page numbers
    var npages=pdf.getNumberOfPages();
    for(var p=1;p<=npages;p++){
      pdf.setPage(p);
      pdf.setFontSize(8);pdf.setFont('helvetica','normal');pdf.setTextColor(148,163,184);
      pdf.text(p+' / '+npages,PW-MR,PH-5,{align:'right'});
    }
    return pdf;
  }

  async function exportPDF(){
    if(!window.html2canvas||!window.jspdf){alert('라이브러리 로딩 중... 잠시 후 다시 시도해주세요.');return;}
    var btn=document.querySelector('[data-pdf-btn]');
    if(btn){btn.textContent='⏳ 기다려...';btn.disabled=true;}
    try{
      var el=document.getElementById('app-main-panel')||document.body;
      var canvas=await window.html2canvas(el,{
        scale:1.8,backgroundColor:'#0f172a',useCORS:true,allowTaint:true,
        ignoreElements:function(n){return n.tagName==='VIDEO';}
      });
      var imgData=canvas.toDataURL('image/jpeg',0.88);
      var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      var pw=pdf.internal.pageSize.getWidth();
      var ph=pdf.internal.pageSize.getHeight();
      var iw=pw; var ih=(canvas.height/canvas.width)*iw;
      var pages=Math.ceil(ih/ph);
      for(var i=0;i<pages;i++){
        if(i>0)pdf.addPage();
        pdf.addImage(imgData,'JPEG',0,-i*ph,iw,ih);
      }
      var dt=new Date().toLocaleDateString('ko').replace(/\./g,'-');
      pdf.save('WVAS-report-'+dt+'.pdf');
    }catch(err){alert('PDF 생성 실패: '+err.message);}
    finally{if(btn){btn.textContent='📥 PDF';btn.disabled=false;}}
  }
