<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PIE 다운로드</title>
<style>
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
       background:#0f172a;color:#e2e8f0;font-family:sans-serif;gap:20px;}
  h1{font-size:1.6rem;color:#38bdf8;margin:0;}
  p{color:#94a3b8;margin:0;font-size:.95rem;}
  button{padding:14px 36px;font-size:1.1rem;font-weight:700;border:none;border-radius:8px;
         background:#2563eb;color:#fff;cursor:pointer;transition:background .2s;}
  button:hover{background:#1d4ed8;}
  button:disabled{background:#334155;color:#64748b;cursor:default;}
  #status{color:#86efac;font-size:.9rem;min-height:1.2em;}
</style>
</head>
<body>
<h1>🏭 PIE – 공정분석 도구</h1>
<p>버튼을 클릭하면 최신 버전을 바로 다운로드합니다.</p>
<button id="btn" onclick="dl()">⬇ PIE.html 다운로드</button>
<div id="status"></div>
<script>
const RAW = 'https://raw.githubusercontent.com/lovekhl83-stack/pie-work-analysis/master/PIE.html';
async function dl(){
  var btn=document.getElementById('btn'), st=document.getElementById('status');
  btn.disabled=true; btn.textContent='다운로드 중…'; st.textContent='';
  try{
    var res=await fetch(RAW);
    if(!res.ok) throw new Error('HTTP '+res.status);
    var blob=await res.blob();
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='PIE.html';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    st.textContent='✓ 다운로드 완료!';
    btn.textContent='⬇ 다시 다운로드';
    btn.disabled=false;
  }catch(e){
    st.style.color='#fca5a5'; st.textContent='오류: '+e.message;
    btn.textContent='⬇ 재시도'; btn.disabled=false;
  }
}
</script>
</body>
</html>
